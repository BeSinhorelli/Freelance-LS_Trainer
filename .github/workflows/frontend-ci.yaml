name: Frontend CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        working-directory: ./lstrainer-web
        run: npm install # <-- Mudou de 'npm ci' para 'npm install'

      - name: Rodar testes
        working-directory: ./lstrainer-web
        run: npm test -- --run

      - name: Build de produção
        working-directory: ./lstrainer-web
        run: npm run build