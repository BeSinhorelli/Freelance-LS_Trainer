name: Frontend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: './lstrainer-web/package-lock.json'

    - name: Instalar dependências
      working-directory: ./lstrainer-web
      run: npm ci

    - name: Rodar testes (Vitest)
      working-directory: ./lstrainer-web
      run: npm test -- --run

    - name: Build de produção
      working-directory: ./lstrainer-web
      run: npm run build