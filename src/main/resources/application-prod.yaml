spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: 28800000
    cookie-name: AUTH_TOKEN
    cookie-secure: true       # Exige HTTPS
    cookie-same-site: None    # Permite o envio entre Vercel e Render