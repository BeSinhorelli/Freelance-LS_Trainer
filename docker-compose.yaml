version: '3.8'

services:
  db:
    image: postgres:16
    container_name: lstrainer-db
    environment:
      POSTGRES_USER: lstrainer_user
      POSTGRES_PASSWORD: lstrainer_password
      POSTGRES_DB: lstrainer
    ports:
      - "5433:5432"
    volumes:
      - lstrainer_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lstrainer_user -d lstrainer"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .  # <-- AQUI ESTÁ A MUDANÇA (era ./lstrainer-api)
    container_name: lstrainer-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/lstrainer
      - SPRING_DATASOURCE_USERNAME=lstrainer_user
      - SPRING_DATASOURCE_PASSWORD=lstrainer_password
      - APP_JWT_SECRET=bHN0cmFpbmVyLXNlY3JldC1rZXktcGFyYS1kZXNlbnZvbHZpbWVudG8tbG9jYWwtbmFvLXVzZS1lbS1wcm9kdWNhby0yMDI1
    depends_on:
      db:
        condition: service_healthy

volumes:
  lstrainer_data: